<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>لوحة التحكم | KHEDR & PHYSIO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root{
    --brand-primary: #8E0E38;
    --brand-dark:    #630825;
    --brand-accent:  #FFB800;
    --ink:           #1C1917;
    --mist:          #F8FAFC;
    --mist-line:     #E2E8F0;
    --dark-bg:       #0F172A;
    --dark-card:     #1E293B;
  }
  html[lang="ar"] body, html[lang="ar"] * { font-family:'Tajawal','IBM Plex Sans Arabic',sans-serif; }
  .num-font { font-family:'Plus Jakarta Sans',sans-serif; }

  body{ background:var(--mist); color:var(--ink); }
  body.dark{ background:var(--dark-bg); color:#F1F5F9; }

  .bg-brand{ background-color:var(--brand-primary); }
  .text-brand{ color:var(--brand-primary); }
  .border-brand{ border-color:var(--brand-primary); }

  .side-link{ color:var(--ink); opacity:.65; transition:.2s; }
  .side-link:hover{ opacity:1; background:rgba(142,14,56,.06); }
  .side-link.active{ opacity:1; background:rgba(142,14,56,.1); color:var(--brand-primary); font-weight:800; }
  body.dark .side-link{ color:#F1F5F9; }

  .skel{ background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 37%,#e2e8f0 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }
  body.dark .skel{ background:linear-gradient(90deg,#1E293B 25%,#334155 37%,#1E293B 63%); background-size:400% 100%; }
  @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} }

  ::selection{ background:var(--brand-primary); color:#fff; }
  [dir="rtl"] .rtl-flip{ transform:scaleX(-1); }
</style>
</head>

<body class="antialiased">

<!-- Loading Gate -->
<div id="authGate" class="fixed inset-0 z-[100] flex items-center justify-center bg-white dark:bg-[#0F172A]">
  <div class="flex flex-col items-center gap-3">
    <div class="w-10 h-10 rounded-full border-4 border-t-transparent animate-spin border-rose-800"></div>
    <span class="text-xs font-bold opacity-50">جاري تحميل بيانات الطالب...</span>
  </div>
</div>

<div class="lg:grid lg:grid-cols-[260px,1fr]">

  <!-- ============ SIDEBAR ============ -->
  <aside class="hidden lg:flex flex-col gap-1 h-screen sticky top-0 border-e p-5 bg-white dark:bg-[#1E293B]" style="border-color:var(--mist-line)">
    <a href="index.html" class="flex items-center gap-2.5 px-2 py-3 mb-4">
      <span class="w-9 h-9 rounded-xl flex items-center justify-center bg-brand text-white font-black text-xs">خِـ</span>
      <div>
        <span class="font-extrabold text-sm block">خِـــضـر</span>
        <span class="text-[9px] font-bold text-slate-400 -mt-1 block">PHYSIO ACADEMY</span>
      </div>
    </a>

    <nav class="flex flex-col gap-1 text-sm">
      <a href="#" class="side-link active flex items-center gap-3 px-3.5 h-11 rounded-xl">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>الرئيسية</span>
      </a>
      <a href="#" class="side-link flex items-center gap-3 px-3.5 h-11 rounded-xl">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5v-13ZM12 4h6.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H12" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>كورساتي</span>
      </a>
      <a href="#" class="side-link flex items-center gap-3 px-3.5 h-11 rounded-xl">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 11.5 11 13.5 15.5 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>امتحانات الـ OSCE & MCQ</span>
      </a>
      <a href="#" class="side-link flex items-center gap-3 px-3.5 h-11 rounded-xl">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5Z" stroke="currentColor" stroke-width="1.7"/></svg>
        <span>المذكرات والتفريغات</span>
      </a>
    </nav>

    <button id="logoutBtn" class="mt-auto flex items-center gap-3 px-3.5 h-11 rounded-xl text-sm font-bold text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/30">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>تسجيل الخروج</span>
    </button>
  </aside>

  <!-- ============ MAIN CONTENT ============ -->
  <main class="px-5 md:px-8 py-8 max-w-5xl w-full mx-auto pb-24 lg:pb-8">

    <!-- Top bar -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <h1 class="text-2xl font-black" id="greeting">مرحبًا 👋</h1>
        <p class="text-xs opacity-60 font-semibold mt-1">رحلتك وتطورك الأكاديمي في العلاج الطبيعي</p>
      </div>
      <div id="userAvatar" class="w-11 h-11 rounded-full bg-brand flex items-center justify-center text-white font-bold skel shadow-md"></div>
    </div>

    <!-- Continue learning -->
    <section class="rounded-3xl bg-brand p-6 md:p-8 text-white relative overflow-hidden mb-8 shadow-xl">
      <span class="text-[11px] font-black px-3 py-1 rounded-full bg-white/20">المحاضرة الحالية</span>
      <h2 id="continueCourseTitle" class="text-lg md:text-xl font-black mt-3 skel h-6 w-56 rounded"></h2>
      <p id="continueLessonTitle" class="text-xs opacity-80 mt-1 skel h-4 w-40 rounded"></p>

      <div class="mt-5 flex items-center gap-3">
        <div class="flex-1 h-2 rounded-full bg-white/20 overflow-hidden">
          <div id="continueProgressBar" class="h-full rounded-full bg-amber-400 transition-all duration-700" style="width:0%"></div>
        </div>
        <span id="continueProgressLabel" class="text-xs font-black num-font">0%</span>
      </div>

      <button class="mt-6 text-xs font-black bg-white text-brand px-6 py-2.5 rounded-xl shadow-lg hover:bg-rose-50 transition">
        متابعة الشرح الآن
      </button>
    </section>

    <!-- Progress Cards -->
    <section class="mb-8">
      <h3 class="text-xs font-black opacity-60 mb-3 uppercase tracking-wider">مهام الأسبوع والامتحانات</h3>
      <div id="todayList" class="grid sm:grid-cols-3 gap-4">
        <div class="skel h-24 rounded-2xl"></div>
        <div class="skel h-24 rounded-2xl"></div>
        <div class="skel h-24 rounded-2xl"></div>
      </div>
    </section>

    <!-- Study Chart -->
    <section class="mb-8">
      <h3 class="text-xs font-black opacity-60 mb-3 uppercase tracking-wider">ساعات التحصيل الأكاديمي</h3>
      <div class="rounded-3xl border p-6 bg-white dark:bg-[#1E293B]" style="border-color:var(--mist-line)">
        <div class="flex items-end justify-between gap-2 h-36" id="weekChart"></div>
        <div class="flex justify-between mt-3 text-[11px] font-bold opacity-45" id="weekLabels"></div>
      </div>
    </section>
  </main>
</div>

<!-- Mobile Nav -->
<nav class="lg:hidden fixed bottom-0 inset-x-0 z-40 border-t bg-white/95 dark:bg-[#0F172A]/95 backdrop-blur flex items-center justify-around h-16" style="border-color:var(--mist-line)">
  <a href="#" class="flex flex-col items-center gap-1 text-[10px] font-bold text-brand">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" stroke="currentColor" stroke-width="1.7"/></svg>
    الرئيسية
  </a>
  <a href="#" class="flex flex-col items-center gap-1 text-[10px] font-bold opacity-50">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5v-13ZM12 4h6.5A1.5 1.5 0 0 1 20 5.5v13a1.5 1.5 0 0 1-1.5 1.5H12" stroke="currentColor" stroke-width="1.7"/></svg>
    كورساتي
  </a>
  <a href="#" class="flex flex-col items-center gap-1 text-[10px] font-bold opacity-50">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 11.5 11 13.5 15.5 9" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/></svg>
    الامتحانات
  </a>
</nav>

<script type="module">
  import { auth, db, onAuthStateChanged, signOut, doc, getDoc } from "./firebase-config.js";

  const authGate = document.getElementById("authGate");

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html#auth";
      return;
    }

    let studentData = null;
    try {
      const snap = await getDoc(doc(db, "students", user.uid));
      if (snap.exists()) studentData = snap.data();
    } catch (e) {
      console.error(e);
    }

    renderDashboard(user, studentData);
    authGate.style.display = "none";
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "index.html";
  });

  function renderDashboard(user, data) {
    const name = data?.fullName || user.displayName || "طالب";
    document.getElementById("greeting").textContent = `مرحبًا يا دكتور ${name} 👋`;
    document.getElementById("userAvatar").textContent = name.trim().charAt(0);
    document.getElementById("userAvatar").classList.remove("skel");

    const continueData = data?.continueLearning || {
      courseTitle: "كورس Biomechanics & Gait Analysis",
      lessonTitle: "تحليل حركة مفصل الركبة والقدم — المحاضرة 3",
      progress: 55
    };
    document.getElementById("continueCourseTitle").textContent = continueData.courseTitle;
    document.getElementById("continueCourseTitle").classList.remove("skel");
    document.getElementById("continueLessonTitle").textContent = continueData.lessonTitle;
    document.getElementById("continueLessonTitle").classList.remove("skel");
    document.getElementById("continueProgressBar").style.width = continueData.progress + "%";
    document.getElementById("continueProgressLabel").textContent = continueData.progress + "%";

    renderToday(data?.today);
    renderWeekChart(data?.weeklyHours || [3, 4.5, 2, 5, 3.5, 1, 2.5]);
  }

  function renderToday(today) {
    const items = today || [
      { icon: "🩻", label: "محطة OSCE قادمة", value: "فحص أربطة الركبة (Lachman Test)" },
      { icon: "📝", label: "كويز MCQ", value: "متاح للتسليم حتى الغد" },
      { icon: "📑", label: "تفريغ جديد", value: "تفريغ محاضرة الـ Spine Mechanics" }
    ];
    document.getElementById("todayList").innerHTML = items.map(i => `
      <div class="rounded-2xl border p-4 bg-white dark:bg-[#1E293B]" style="border-color:var(--mist-line)">
        <span class="text-xl">${i.icon}</span>
        <div class="text-[11px] font-bold opacity-50 mt-2">${i.label}</div>
        <div class="text-xs font-black mt-0.5">${i.value}</div>
      </div>
    `).join("");
  }

  function renderWeekChart(hours) {
    const days = ["س", "أ", "ن", "ث", "ر", "خ", "ج"];
    const max = Math.max(...hours, 1);
    document.getElementById("weekChart").innerHTML = hours.map(h => `
      <div class="flex-1 rounded-lg bg-brand" style="height:${(h / max) * 100}%;"></div>
    `).join("");
    document.getElementById("weekLabels").innerHTML = days.map(d => `<span class="flex-1 text-center">${d}</span>`).join("");
  }
</script>
</body>
</html>
